name: Update LOTO data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1"
    - cron: "30 22 * * 3"
    - cron: "30 22 * * 6"

concurrency:
  group: update-loto-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Security audit
        run: npm run audit:ci

      - name: Unit/type checks before data update
        run: npm run check

      - name: Update official FDJ data
        run: npm run update

      - name: Final validation and tests
        run: |
          npm run validate
          npm run check

      - name: Commit updated data
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): update LOTO draws"
          git push

      # After the commit so any new data is still published; a stale dataset turns the run red
      # and GitHub emails the maintainer.
      - name: Check data freshness
        run: npm run freshness
